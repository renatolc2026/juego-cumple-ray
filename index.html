<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#120c1f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Ray y la Melodía Perdida — un RPG de cumpleaños hecho con cariño por Tato." />
    <title>Ray y la Melodía Perdida</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23120c1f'/%3E%3Cpath d='M6 3h6v2H8v6a2.5 2.5 0 1 1-2-2.45z' fill='%23ffd166'/%3E%3C/svg%3E" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #120c1f;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #game {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        color: #ffd166;
        font-family: 'Press Start 2P', monospace;
        font-size: 12px;
        text-align: center;
        line-height: 1.8;
        z-index: 5;
        background: #120c1f;
      }
      #loading .note { font-size: 36px; animation: bob 0.8s ease-in-out infinite alternate; }
      @keyframes bob { from { transform: translateY(-6px); } to { transform: translateY(6px); } }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #120c1f;
        color: #fff4d6;
        font-family: 'Press Start 2P', monospace;
        font-size: 12px;
        line-height: 2;
        text-align: center;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 24px;
        box-sizing: border-box;
      }
      #rotate .phone {
        width: 44px;
        height: 76px;
        border: 4px solid #ffd166;
        border-radius: 8px;
        margin-bottom: 24px;
        animation: turn 1.6s ease-in-out infinite;
      }
      @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading"><div class="note">♪</div><div>Cargando la música...</div></div>
    <div id="rotate">
      <div class="phone"></div>
      <div>Gira tu celular<br />para jugar ♪</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
