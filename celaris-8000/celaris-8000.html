<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Celaris 8000 seguidores</title>
<style>
/* ============================================================
   CELARIS ENERGY — SISTEMA VISUAL (fuente de verdad)
   Derivado del Manual de identidad de marca (28/11/2025).
   Embeber este CSS en cada pieza. NO linkear, NO desviarse.
   ============================================================ */

/* ---------- 1. TOKENS INVIOLABLES ---------- */
:root {
  /* Paleta principal — debe predominar */
  --cel-morado:        #653bec;   /* Pantone 2725 C — color madre */
  --cel-blanco:        #ffffff;

  /* Morado oscuro — base de degradados y textos breves */
  --cel-morado-osc:    #24083e;   /* Pantone 2695 C */

  /* Acentos secundarios — SOLO toques puntuales, nunca protagonistas.
     Orden de preferencia real de la marca: naranja > los demás. */
  --cel-naranja:       #e38a22;   /* Pantone 1495 C — acento preferente */
  --cel-verde:         #41e394;   /* Pantone 2412 C */
  --cel-teal:          #8efcdb;   /* Pantone 2239 C */
  --cel-celeste:       #84e9fd;   /* Pantone 297 C */
  --cel-lima:          #d2fd3c;   /* Pantone 2297 C */
  --cel-amarillo:      #fffd3c;   /* Pantone 102 C */

  /* Neutros */
  --cel-gris-claro:    #ededed;   /* Pantone 427 C — fondos/divisores */
  --cel-gris-texto:    #7e7e7e;   /* Cool Gray 9 C — texto secundario */
  --cel-negro-texto:   #1a1130;   /* texto principal sobre fondo claro */

  /* Fondos web / UX / UI — pasteles, SOLO en digital, como fondo suave */
  --cel-bg-lila:       #dedaf9;
  --cel-bg-lila-2:     #f2f2f9;
  --cel-bg-celeste:    #c0f5f9;
  --cel-bg-celeste-2:  #def9f9;
  --cel-bg-menta:      #cdf9e8;
  --cel-bg-menta-2:    #e8f9f3;
  --cel-bg-verde:      #d2f9de;
  --cel-bg-verde-2:    #e7f7ea;
  --cel-bg-lima:       #eef7c9;
  --cel-bg-lima-2:     #f6f7e8;
  --cel-bg-amarillo:   #f9f8c5;
  --cel-bg-amarillo-2: #f9f8ea;
  --cel-bg-durazno:    #f7e8da;
  --cel-bg-durazno-2:  #f9f2ed;

  /* Degradados — base diagonal + acento en UNA esquina.
     Uso: primero SIEMPRE el principal (acento naranja). */
  --cel-grad-principal:  linear-gradient(135deg, #24083e 0%, #653bec 55%, #e38a22 100%);
  --cel-grad-verde:      linear-gradient(135deg, #24083e 0%, #653bec 55%, #41e394 100%);
  --cel-grad-teal:       linear-gradient(135deg, #24083e 0%, #653bec 55%, #8efcdb 100%);
  --cel-grad-celeste:    linear-gradient(135deg, #24083e 0%, #653bec 55%, #84e9fd 100%);
  --cel-grad-lima:       linear-gradient(135deg, #24083e 0%, #653bec 55%, #d2fd3c 100%);
  --cel-grad-amarillo:   linear-gradient(135deg, #24083e 0%, #653bec 55%, #fffd3c 100%);
  /* Nota: el manual muestra el acento como "bloom" desde una esquina.
     Para más realismo usar radial-gradient de esquina SOBRE la base:
     background: radial-gradient(circle at 100% 100%, #e38a22 0%, transparent 45%), linear-gradient(135deg,#24083e,#653bec);
     Elegir UNA esquina (de 4) por pieza. Nunca en logo ni sobre texto. */

  /* Tipografía */
  --cel-font: 'Lexend', system-ui, -apple-system, sans-serif;
  --cel-font-office: Arial, Helvetica, sans-serif; /* solo si Lexend no carga */

  /* Escala tipográfica (jerarquía por peso + tamaño) */
  --cel-fs-display: 64px;   --cel-fw-display: 800;
  --cel-fs-h1:      44px;   --cel-fw-h1:      700;
  --cel-fs-h2:      32px;   --cel-fw-h2:      600;
  --cel-fs-h3:      24px;   --cel-fw-h3:      600;
  --cel-fs-body:    18px;   --cel-fw-body:    400;
  --cel-fs-small:   14px;   --cel-fw-small:   400;

  /* Composición */
  --cel-margin: 5%;          /* margen = 5% del lado más corto */
  --cel-radius-pill: 999px;  /* pastillas y círculos */
  --cel-radius-rect: 0px;    /* rectángulos: SIN esquinas redondeadas */
}

/* ---------- 2. RESET MÍNIMO ---------- */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--cel-font);
  color: var(--cel-negro-texto);
  -webkit-font-smoothing: antialiased;
  line-height: 1.4;
}

/* ---------- 3. TIPOGRAFÍA (cuerpos a la izquierda; centrar solo títulos) ---------- */
.cel-display { font-size: var(--cel-fs-display); font-weight: var(--cel-fw-display); line-height: 1.05; letter-spacing: -0.02em; }
.cel-h1 { font-size: var(--cel-fs-h1); font-weight: var(--cel-fw-h1); line-height: 1.1; letter-spacing: -0.01em; }
.cel-h2 { font-size: var(--cel-fs-h2); font-weight: var(--cel-fw-h2); line-height: 1.15; }
.cel-h3 { font-size: var(--cel-fs-h3); font-weight: var(--cel-fw-h3); line-height: 1.2; }
.cel-body { font-size: var(--cel-fs-body); font-weight: var(--cel-fw-body); text-align: left; }
.cel-small { font-size: var(--cel-fs-small); color: var(--cel-gris-texto); }
/* Sobre fondo claro, los titulares van en MORADO (no negro). */
.cel-title-on-light { color: var(--cel-morado); }

/* Gesto de marca: eco de la barra degradada de la "e" del logo.
   Va como SUBRAYADO por debajo de la palabra (nunca cruzándola, para que no
   parezca tachado). Úsalo con moderación; el divisor .cel-bar ya lo evoca. */
.cel-estroke { position: relative; display: inline-block; }
.cel-estroke::after {
  content: ""; position: absolute; left: 0; right: 6%;
  bottom: -0.12em; height: 0.09em; border-radius: 2px; opacity: 0.9;
  background: linear-gradient(90deg, #653bec 0%, rgba(101,59,236,0) 80%);
}
.cel-estroke--onDark::after {
  background: linear-gradient(90deg, #ffffff 0%, rgba(255,255,255,0) 80%);
}

/* ---------- 4. FONDOS ---------- */
.cel-bg-morado   { background: var(--cel-morado);      color: var(--cel-blanco); }
.cel-bg-blanco   { background: var(--cel-blanco);      color: var(--cel-negro-texto); }
.cel-bg-grad     { background: var(--cel-grad-principal); color: var(--cel-blanco); }
.cel-bg-grad-bloom {
  color: var(--cel-blanco);
  background:
    radial-gradient(circle at 100% 100%, #e38a22 0%, rgba(227,138,34,0) 45%),
    linear-gradient(135deg, #24083e 0%, #653bec 100%);
}

/* ---------- 5. COMPONENTES DE MARCA ---------- */

/* Pastilla — segmentar áreas / CTAs. Ambos extremos redondeados. */
.cel-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 22px; border-radius: var(--cel-radius-pill);
  font-weight: 600; font-size: var(--cel-fs-small);
  background: var(--cel-morado); color: var(--cel-blanco);
  width: fit-content;
}
.cel-pill--acento { background: var(--cel-naranja); color: var(--cel-blanco); }
.cel-pill--outline { background: transparent; border: 2px solid currentColor; }

/* Círculo destacado — keywords, %, números, íconos. Nunca óvalo. */
.cel-circle {
  display: inline-flex; align-items: center; justify-content: center;
  aspect-ratio: 1 / 1; border-radius: 50%;
  background: var(--cel-morado); color: var(--cel-blanco);
  font-weight: 800; text-align: center;
}
.cel-circle--data { width: 180px; font-size: 52px; }   /* para dato/% grande */
.cel-circle--acento { background: var(--cel-naranja); }

/* Rectángulo gráfico — segmentar/destacar. SIN redondeo, SIN sombra, SIN vertical. */
.cel-rect {
  background: var(--cel-morado); color: var(--cel-blanco);
  border-radius: var(--cel-radius-rect);
  padding: 24px 32px;
}
.cel-rect--bleed-left {  /* rebasa el borde izquierdo del formato */
  margin-left: calc(-1 * var(--cel-margin));
  padding-left: calc(var(--cel-margin) + 32px);
}

/* Número fantasma — recurso de jerarquía (ghost number) */
.cel-ghost-num {
  font-weight: 800; line-height: 1;
  font-size: 200px; color: var(--cel-morado); opacity: 0.10;
}

/* Barra de la "e" — guiño al logo: barrita degradada corta como divisor/acento */
.cel-bar {
  height: 6px; width: 72px; border-radius: 3px; border: none;
  background: var(--cel-grad-principal);
}

/* ---------- 6. LAYOUT ---------- */
.cel-frame {              /* contenedor con margen de marca (5%) */
  padding: var(--cel-margin);
  position: relative;
}
.cel-flex { display: flex; gap: 24px; }
.cel-flex-col { display: flex; flex-direction: column; gap: 16px; }
.cel-center { text-align: center; }   /* usar SOLO en titulares/frases breves */

/* Logo OFICIAL (imagen). Usar logo-morado-web.png sobre fondos claros y
   logo-blanco-web.png sobre morado/degradado. Nunca degradado encima, nunca
   recolorear, nunca deformar. Para piezas autónomas, embeber el base64 de
   los archivos .b64 provistos. Relación de aspecto ~2.446:1.
   IMPORTANTE: dar SIEMPRE ancho explícito y align-self:flex-start. Dentro de
   un contenedor flex-column, align-items:stretch (el default) estira la imagen
   a lo ancho y la deforma. Fijar el ancho lo evita. */
.cel-logo { width: 210px; height: auto; align-self: flex-start; display: block; }
.cel-logo--sm { width: 150px; }
.cel-logo--lg { width: 280px; }

/* Textura (auxiliar, baja opacidad) — placeholder de puntos circulares */
.cel-texture-dots {
  position: absolute; inset: 0; pointer-events: none; opacity: 0.12;
  background-image: radial-gradient(currentColor 2px, transparent 2px);
  background-size: 26px 26px;
}

html, body { width: 1080px; height: 1350px; overflow: hidden; background: #24083e; }
#stage { position: relative; width: 1080px; height: 1350px; overflow: hidden; }
.layer { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; }
.mask { overflow: hidden; display: block; padding: 0 0 0.06em; }
.mask > span { display: inline-block; will-change: transform; }

/* L1 — escena oscura (degradado principal) */
#L1 { background: linear-gradient(135deg, #24083e 0%, #653bec 100%); color: #fff; }
.bloom { position: absolute; inset: 0;
  background: radial-gradient(circle at 100% 100%, #e38a22 0%, rgba(227,138,34,0) 45%); }
#L1 .cel-texture-dots { color: #fff; opacity: 0.07; }

.s1 { left: 54px; top: 380px; }
.s1 .line { font-size: 176px; font-weight: 800; line-height: 1.0; letter-spacing: -0.035em; }
.s1 .pill-wrap { margin-bottom: 34px; }
.cel-pill.big { font-size: 26px; padding: 14px 30px; }

#ringwrap { left: 0; top: 0; width: 1080px; height: 1350px; }
#counterWrap { left: 0; width: 1080px; top: 0; height: 1350px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; }
#kicker { font-size: 36px; font-weight: 500; letter-spacing: 0.02em; margin-bottom: 4px; }
#num { font-size: 270px; font-weight: 800; letter-spacing: -0.045em; line-height: 1;
  font-variant-numeric: tabular-nums; }
#seg { margin-top: 30px; font-size: 36px; padding: 16px 42px; }

/* L2 — escena blanca */
#L2 { background: #fff; color: var(--cel-morado); }
.s3 { left: 54px; top: 360px; }
.s3 .pill-wrap { margin-bottom: 30px; }
.s3 .line { font-size: 146px; font-weight: 800; line-height: 1.0; letter-spacing: -0.035em; }
.s3 .cel-bar { margin-top: 44px; height: 10px; border-radius: 5px; }
#bigCircle { width: 520px; height: 520px; border-radius: 50%; background: var(--cel-morado);
  left: 640px; top: 900px; display: flex; align-items: center; justify-content: center; color: #fff; }


/* L3 — cierre */
#L3 { background: linear-gradient(135deg, #24083e 0%, #653bec 100%); color: #fff; }
#endWrap { left: 0; top: -40px; width: 1080px; height: 1350px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; }
#endWrap .line { font-size: 116px; font-weight: 800; line-height: 1.02; letter-spacing: -0.035em; }
#endWrap .cel-bar { margin: 40px 0 34px; width: 120px; height: 10px; border-radius: 5px; }
#ctaLead { font-size: 60px; font-weight: 600; line-height: 1.22; letter-spacing: -0.01em; }
#ctas { margin-top: 46px; display: flex; gap: 18px; justify-content: center; }
.cta { position: relative; font-size: 28px; padding: 14px 28px 14px 14px; gap: 12px; }
.cta .ico { width: 50px; height: 50px; border-radius: 50%; background: #fff; display: inline-flex;
  align-items: center; justify-content: center; flex: none; }
.cta .ico svg { width: 28px; height: 28px; fill: none; stroke: var(--cel-morado); stroke-width: 2.2;
  stroke-linecap: round; stroke-linejoin: round; }
.cta.cel-pill--outline { border-width: 3px; }
.ripple { position: absolute; left: 50%; top: 50%; width: 80px; height: 80px; margin: -40px 0 0 -40px;
  border-radius: 50%; border: 3px solid #fff; opacity: 0; pointer-events: none; }
/* L4 — cierre de marca */
#L4 { background: var(--cel-morado); color: #fff; visibility: hidden; }
#brandWrap { left: 0; top: 0; width: 1080px; height: 1150px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; }
#brandWrap .line { font-size: 178px; font-weight: 800; line-height: 1.0; letter-spacing: -0.04em; }
#bar4 { margin-top: 46px; width: 0; height: 12px; border-radius: 6px; }
#logo4 { left: 350px; top: 1060px; width: 380px; height: auto; }
#site4 { left: 0; width: 1080px; bottom: 54px; text-align: center; font-size: 26px; font-weight: 500; opacity: .85; }

<script>
const DURATION = 13.0;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

const outExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const inExpo = k => k <= 0 ? 0 : Math.pow(2, 10 * k - 10);
const inOutExpo = k => k <= 0 ? 0 : k >= 1 ? 1 : k < .5 ? Math.pow(2, 20 * k - 10) / 2 : (2 - Math.pow(2, -20 * k + 10)) / 2;
const outCubic = k => 1 - Math.pow(1 - k, 3);
const inOutCubic = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const outQuart = k => 1 - Math.pow(1 - k, 4);
const outBack = (k, s = 1.70158) => 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2);
const set = (el, props) => Object.assign(el.style, props);

// Línea enmascarada: entra desde abajo y sale hacia arriba.
function line(el, t, tin, tout, dIn = 0.9, dOut = 0.5) {
  const a = outExpo(p(t, tin, dIn));
  const b = Math.pow(p(t, tout, dOut), 3);
  const y = lerp(110, 0, a) - 115 * b;
  set(el, { transform: `translateY(${y}%) skewY(${(1 - a) * 6}deg)` });
}

// Partículas de energía (determinísticas)
function rand(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const R = rand(42);
const parts = [];
for (let i = 0; i < 26; i++) {
  const d = document.createElement('div');
  d.className = 'dot';
  const size = 4 + R() * 10;
  parts.push({ el: d, x: R() * 1080, y0: R() * 1350, v: 40 + R() * 90, size, o: .12 + R() * .3, ph: R() * 6.28 });
  set(d, { width: size + 'px', height: size + 'px', background: '#fff' });
  $('particles').appendChild(d);
}
// Ráfaga al llegar a 8,000
const bursts = [];
for (let i = 0; i < 18; i++) {
  const d = document.createElement('div');
  d.className = 'dot';
  const ang = (i / 18) * Math.PI * 2 + R() * 0.2;
  const size = 10 + R() * 16;
  const orange = i % 6 === 0;
  bursts.push({ el: d, ang, dist: 470 + R() * 220, size });
  set(d, { width: size + 'px', height: size + 'px', background: orange ? '#e38a22' : '#fff' });
  $('burst').appendChild(d);
}

const fmt = n => String(Math.round(n));
const RING_C = 2 * Math.PI * 430;
const T_COUNT0 = 2.25, T_COUNT1 = 4.8;

function render(t) {
  // ---------- L1 fondo ----------
  set($('bloom1'), { opacity: lerp(0.35, 1, inOutCubic(p(t, 0, 5))), transform: `scale(${lerp(1.25, 1, outCubic(p(t, 0, 6)))})`, transformOrigin: '100% 100%' });
  set($('tex1'), { backgroundPosition: `${t * 8}px ${-t * 14}px` });
  for (const q of parts) {
    const y = ((q.y0 - q.v * t) % 1350 + 1350) % 1350;
    set(q.el, { left: (q.x + Math.sin(t * 1.3 + q.ph) * 14) + 'px', top: y + 'px', opacity: q.o * (0.5 + 0.5 * Math.sin(t * 2 + q.ph)) });
  }
  set($('logo1'), { opacity: outCubic(p(t, 0.1, 0.6)), transform: `translateY(${lerp(-20, 0, outExpo(p(t, 0.1, 0.8)))}px)` });

  // ---------- Escena 1 ----------
  const pillIn = outBack(p(t, 0.05, 0.6));
  const pillOut = Math.pow(p(t, 1.55, 0.35), 3);
  set($('s1pill'), { transform: `scale(${pillIn * (1 - pillOut)})`, transformOrigin: '0 50%', opacity: 1 - pillOut });
  line($('s1l1'), t, 0.15, 1.6, 0.9, 0.42);
  line($('s1l2'), t, 0.32, 1.66, 0.9, 0.42);
  line($('s1l3'), t, 0.49, 1.72, 0.9, 0.42);
  // "más." se infla un poco antes de salir
  const pump = Math.sin(clamp(p(t, 1.15, 0.45)) * Math.PI) * 0.06;
  $('s1l3').style.transform += ` scale(${1 + pump})`;
  $('s1l3').style.transformOrigin = '0 80%';
  $('s1').style.display = t > 2.5 ? 'none' : 'block';

  // ---------- Escena 2: anillo + contador ----------
  const ringIn = outExpo(p(t, 2.08, 0.8));
  const ringOut = inOutExpo(p(t, 5.3, 0.6));
  const ringScale = lerp(0.6, 1, ringIn) * lerp(1, 1.6, ringOut);
  const sceneOp = ringIn * (1 - ringOut);
  const svg = $('ringwrap');
  set(svg, { opacity: sceneOp, transform: `scale(${ringScale}) rotate(${lerp(-30, 0, ringIn)}deg)`, transformOrigin: '540px 675px' });
  const k = inOutCubic(p(t, T_COUNT0, T_COUNT1 - T_COUNT0));
  $('ring').setAttribute('stroke-dasharray', RING_C);
  $('ring').setAttribute('stroke-dashoffset', RING_C * (1 - k));
  const ang = -Math.PI / 2 + k * Math.PI * 2;
  $('ringHead').setAttribute('cx', 540 + 430 * Math.cos(ang));
  $('ringHead').setAttribute('cy', 675 + 430 * Math.sin(ang));
  $('ringHead').setAttribute('r', 16 * (1 - p(t, T_COUNT1, 0.3)));
  const sh = p(t, T_COUNT1, 0.9);
  $('shock').setAttribute('r', 430 + outExpo(sh) * 260);
  $('shock').setAttribute('stroke-opacity', sh > 0 ? (1 - sh) * 0.7 : 0);
  $('shock').setAttribute('stroke-width', 4 + 30 * (1 - sh));

  const cnt = outQuart(p(t, T_COUNT0, T_COUNT1 - T_COUNT0));
  $('num').textContent = fmt(8000 * cnt);
  const hit = p(t, T_COUNT1, 0.55);
  const punch = 1 + Math.sin(hit * Math.PI) * 0.12 * (1 - hit * 0.3);
  const cw = $('counterWrap');
  const numIn = outExpo(p(t, 2.12, 0.7));
  set($('num'), { transform: `scale(${lerp(0.7, 1, numIn) * punch})`, opacity: numIn });
  set($('kicker'), { opacity: outCubic(p(t, 2.35, 0.6)), transform: `translateY(${lerp(30, 0, outExpo(p(t, 2.35, 0.8)))}px)` });
  const segIn = outBack(p(t, T_COUNT1 + 0.1, 0.55), 2.2);
  set($('seg'), { transform: `scale(${segIn})`, opacity: clamp(segIn) });
  set(cw, { opacity: 1 - ringOut, transform: `scale(${lerp(1, 1.25, ringOut)})`, transformOrigin: '540px 675px' });

  for (const b of bursts) {
    const q = p(t, T_COUNT1, 1.1);
    const d = lerp(430, b.dist, outExpo(q));
    set(b.el, { left: (540 + Math.cos(b.ang) * d - b.size / 2) + 'px', top: (675 + Math.sin(b.ang) * d - b.size / 2) + 'px',
      opacity: q > 0 && q < 1 ? 1 - q : 0, transform: `scale(${1 - q * 0.6})` });
  }

  // ---------- Transición L1 → L2 (barrido desde abajo) ----------
  const w = inOutExpo(p(t, 5.5, 0.7));
  const edge = lerp(1350 + 40, 0, w);           // borde superior del blanco
  $('L2').style.clipPath = `inset(${Math.max(0, edge)}px 0 0 0)`;
  const bandW = inOutExpo(p(t, 5.43, 0.7));
  const bandTop = lerp(1350 + 10, -36, bandW);
  set($('band'), { top: bandTop + 'px', display: bandW > 0 && bandW < 1 ? 'block' : 'none' });

  // ---------- Escena 3 ----------
  set($('s3pill'), { transform: `scale(${outBack(p(t, 5.85, 0.55))})`, transformOrigin: '0 50%' });
  line($('s3l1'), t, 5.95, 99);
  line($('s3l2'), t, 6.1, 99);
  set($('s3bar'), { width: lerp(0, 160, outExpo(p(t, 6.4, 0.8))) + 'px' });
  const bc = outBack(p(t, 6.2, 0.8), 1.4);
  set($('bigCircle'), { transform: `scale(${bc})` });
  const lg2 = p(t, 5.75, 0.5);
  set($('logo2'), { opacity: lg2 });

  // ---------- Transición L2 → L3 (el círculo se abre) ----------
  const c = inOutExpo(p(t, 6.85, 0.75));
  const r = c <= 0 ? 0 : lerp(260, 1750, c);
  $('L3').style.clipPath = `circle(${r}px at 900px 1160px)`;
  $('L3').style.visibility = c > 0 ? 'visible' : 'hidden';

  // ---------- Escena 4: cierre ----------
  set($('bloom3'), { opacity: inOutCubic(p(t, 7.2, 1.6)), transform: `scale(${lerp(1.4, 1, outCubic(p(t, 7.2, 1.8)))})`, transformOrigin: '100% 100%' });
  line($('lead1'), t, 7.15, 99);
  line($('lead2'), t, 7.27, 99);
  set($('ebar'), { width: lerp(0, 120, outExpo(p(t, 7.6, 0.7))) + 'px' });
  line($('e1'), t, 7.8, 99);
  line($('e2'), t, 7.95, 99);
  // Pastillas CTA: entran al ritmo (corcheas) con un "tap"
  [[1, 8.40], [2, 8.70], [3, 9.00]].forEach(([i, t0]) => {
    const el = $('cta' + i);
    const k = outBack(p(t, t0, 0.5), 2.4);
    const press = i === 3 ? 1 - Math.sin(clamp(p(t, 9.30, 0.28)) * Math.PI) * 0.1 : 1;
    set(el, { transform: `translateY(${lerp(40, 0, outExpo(p(t, t0, 0.6)))}px) scale(${k * press})`, opacity: clamp(k * 1.5) });
    const rp = el.querySelector('.ripple');
    const rr = p(t, i === 3 ? 9.30 : t0 + 0.12, 0.6);
    set(rp, { opacity: rr > 0 && rr < 1 ? (1 - rr) * 0.6 : 0, transform: `scale(${lerp(0.4, i === 3 ? 2.9 : 2.3, outExpo(rr))})` });
  });

  // ---------- Transición L3 → L4 (barrido desde la izquierda) ----------
  const w4 = inOutExpo(p(t, 9.45, 0.6));
  $('L4').style.visibility = w4 > 0 ? 'visible' : 'hidden';
  $('L4').style.clipPath = `inset(0 ${(1 - w4) * 100}% 0 0)`;

  // ---------- Escena 5: cierre de marca "Enciende tu poder" ----------
  line($('b1'), t, 9.8, 99, 1.0);
  line($('b2'), t, 9.95, 99, 1.0);
  set($('bar4'), { width: lerp(0, 150, outExpo(p(t, 10.25, 0.8))) + 'px' });
  const pulse = 1 + Math.sin(p(t, 12.0, 0.45) * Math.PI) * 0.035;
  set($('brandWrap'), { transform: `scale(${lerp(1, 1.035, p(t, 9.6, 3.4)) * pulse})`, transformOrigin: '540px 575px' });
  set($('logo4'), { opacity: outCubic(p(t, 10.35, 0.6)), transform: `translateY(${lerp(30, 0, outExpo(p(t, 10.35, 0.9)))}px)` });
  set($('site4'), { opacity: 0.85 * outCubic(p(t, 10.6, 0.6)) });
  // anillos de energía al "encender" (9,85) y en el acorde final (12,0)
  [['rg1', 9.85], ['rg2', 10.0], ['rg3', 12.0], ['rg4', 12.12]].forEach(([id, t0]) => {
    const q = p(t, t0, 1.3);
    $(id).setAttribute('r', lerp(160, 760, outExpo(q)));
    $(id).setAttribute('stroke-opacity', q > 0 && q < 1 ? (1 - q) * (id === 'rg3' ? 0.8 : 0.4) : 0);
  });
  set($('logo3'), { opacity: outCubic(p(t, 7.1, 0.5)) });
}

window.render = render;
window.DURATION = DURATION;
// Vista previa en navegador (no se usa al renderizar)
if (!location.hash.includes('render')) {
  let t0 = null;
  const loop = ts => { if (t0 === null) t0 = ts; render(((ts - t0) / 1000) % (DURATION + 1)); requestAnimationFrame(loop); };
  document.fonts.ready.then(() => requestAnimationFrame(loop));
} else { render(0); }
</script>
</body>
</html>
